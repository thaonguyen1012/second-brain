# Production stack on the VPS (config only, not deployed yet). Run from the repo root:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
# No service publishes a port: cloudflared opens an outbound tunnel and forwards to nginx:8080.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: alex_brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in deploy/.env}
      POSTGRES_DB: alex_brain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alex_brain"]
      interval: 10s

  django:
    build: ../backend
    restart: unless-stopped
    env_file: ../backend/.env  # DEBUG=false, AUTH_MODE=cf_access, OWNER_EMAIL, CF_ACCESS_*, SECRET_KEY
    environment:
      DATABASE_URL: postgres://alex_brain:${POSTGRES_PASSWORD}@db:5432/alex_brain
      CONTENT_DIR: /srv/alex-brain/content
      FILES_DIR: /srv/alex-brain/files
      ALLOWED_HOSTS: brain.example.com
      CSRF_TRUSTED_ORIGINS: https://brain.example.com
    volumes:
      - ../web/content/docs:/srv/alex-brain/content:ro
      - ${FILES_DIR:?set in deploy/.env}:/srv/alex-brain/files:ro
      - staticfiles:/srv/alex-brain/staticfiles
    depends_on:
      db: { condition: service_healthy }

  web:
    build:
      context: ../web
      args:
        NEXT_PUBLIC_PROGRESS_STORE: api
    restart: unless-stopped
    environment:
      CONTENT_DIR: /srv/alex-brain/content
      SEARCH_DB: /srv/alex-brain/search.sqlite
    volumes:
      - ../web/content/docs:/srv/alex-brain/content:ro
      - ../web/data/search.sqlite:/srv/alex-brain/search.sqlite:ro

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/site.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/security-headers.conf:/etc/nginx/snippets/security-headers.conf:ro
      - ./nginx/proxy-headers.conf:/etc/nginx/snippets/proxy-headers.conf:ro
      - ${FILES_DIR}:/srv/alex-brain/files:ro
      - staticfiles:/srv/alex-brain/staticfiles:ro
    depends_on: [web, django]

  cloudflared:
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set in deploy/.env}
    depends_on: [nginx]

volumes:
  pgdata:
  staticfiles:
