# Included by every location that sets its own proxy_set_header (nginx drops inherited ones otherwise).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Proto https;  # TLS ends at Cloudflare; the tunnel is the only way in
proxy_set_header Connection "";
