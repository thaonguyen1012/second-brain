# Alex's Brain, production. Only cloudflared reaches this server (no published ports, see
# docker-compose.prod.yml); Cloudflare Access has already authenticated the request and adds
# Cf-Access-Jwt-Assertion, which Django verifies again.
#
# nginx inheritance trap: a location with any add_header / proxy_set_header loses the server-level ones,
# so such locations include the snippets again.

upstream web    { server web:3000;    keepalive 16; }
upstream django { server django:8000; keepalive 16; }

server {
    listen 8080;
    server_name brain.example.com;
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/snippets/security-headers.conf;
    # Report-only first (DECISIONS 10.5): no external origin; Mermaid comes from /vendor/ (same origin).
    # Next inlines bootstrap scripts and styles, hence 'unsafe-inline' until nonces are added.
    # No report endpoint yet: violations show in the browser console.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    proxy_http_version 1.1;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Next.js route under /api/ (search).
    location ^~ /api/search { proxy_pass http://web; }

    # Django. proxy_pass without a URI forwards the raw path, so %2F in page paths reaches Django intact.
    location /api/        { proxy_pass http://django; }
    location /admin/      { proxy_pass http://django; }
    location = /healthz   { proxy_pass http://django; }
    location /admin-static/ {
        alias /srv/alex-brain/staticfiles/;
        expires 7d;
    }

    # Attachments: auth_request asks Django whether the caller is the owner; then Django checks the path
    # and answers with X-Accel-Redirect (plus Content-Type / Content-Disposition, which nginx keeps), and
    # nginx streams the file from the internal location below.
    location /files/ {
        auth_request /_auth;
        proxy_pass http://django;
    }
    location = /_auth {
        internal;
        proxy_pass http://django/api/me;
        proxy_pass_request_body off;
        include /etc/nginx/snippets/proxy-headers.conf;
        proxy_set_header Content-Length "";
    }
    location /internal/files/ {
        internal;
        alias /srv/alex-brain/files/;
        include /etc/nginx/snippets/security-headers.conf;
        # Attachments are documents, never part of the app: no scripts, no requests, no framing.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    # Inbox thumbnails: Django checks the owner at /api/inbox/<id>/thumbnail and answers with
    # X-Accel-Redirect; the webp files were written by run_jobs (re-encoded, never the original bytes).
    location /internal/thumbs/ {
        internal;
        alias /srv/alex-brain/thumbs/;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Everything else: Next.js (pages incl. the /inbox/them/ capture page, /manifest.webmanifest, /icons/,
    # /trees/, /original/, /vendor/, /_next/).
    location / { proxy_pass http://web; }
}
