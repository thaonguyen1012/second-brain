# Alex's Brain without Docker (deploy/README.md, "systemd"): the same site as deploy/nginx/site.conf with the
# upstreams on loopback ports, nginx itself on 127.0.0.1:8080 only (another web server may hold 80 and 443), and the
# files under /srv/brain. Only cloudflared reaches this server; Cloudflare Access has already authenticated the
# request and adds Cf-Access-Jwt-Assertion, which Django verifies again.
# Install as /etc/nginx/sites-available/brain.conf, linked from sites-enabled; the two snippets as
# /etc/nginx/snippets/brain-security-headers.conf and brain-proxy-headers.conf (from deploy/nginx/).
# nginx inheritance trap: a location with any add_header / proxy_set_header loses the server-level ones,
# so such locations include the snippets again.

upstream web    { server 127.0.0.1:3001; keepalive 16; }
upstream django { server 127.0.0.1:8001; keepalive 16; }

server {
    listen 127.0.0.1:8080;
    server_name brain.example.com;
    server_tokens off;
    client_max_body_size 2m;

    include /etc/nginx/snippets/brain-security-headers.conf;
    # Report-only first (DECISIONS 10.5): no external origin; Mermaid comes from /vendor/ (same origin).
    # Next inlines bootstrap scripts and styles, hence 'unsafe-inline' until nonces are added.
    # No report endpoint yet: violations show in the browser console.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    proxy_http_version 1.1;
    include /etc/nginx/snippets/brain-proxy-headers.conf;

    # Next.js route under /api/ (search).
    location ^~ /api/search { proxy_pass http://web; }

    # Django. proxy_pass without a URI forwards the raw path, so %2F in page paths reaches Django intact.
    location /api/        { proxy_pass http://django; }
    # Item image uploads (POST /api/items/<id>/image); every other body stays at 2m. This limit counts the whole
    # multipart body (the file plus its boundary and part headers), so it sits 1 MB above ITEM_IMAGE_MAX_BYTES
    # (10 MB): Django stays the check and answers a file that is too big with its JSON 400; only a body over
    # 11m gets nginx's HTML 413. A regex location wins over the /api/ prefix; it inherits the same proxy settings.
    location ~ ^/api/items/\d+/image$ {
        client_max_body_size 11m;
        proxy_pass http://django;
    }
    location /admin/      { proxy_pass http://django; }
    location = /healthz   { proxy_pass http://django; }
    location /admin-static/ {
        alias /srv/brain/staticfiles/;
        expires 7d;
    }

    # Attachments: auth_request asks Django whether the caller is the owner; then Django checks the path
    # and answers with X-Accel-Redirect (plus Content-Type / Content-Disposition, which nginx keeps), and
    # nginx streams the file from the internal location below.
    location /files/ {
        auth_request /_auth;
        proxy_pass http://django;
    }
    location = /_auth {
        internal;
        proxy_pass http://django/api/me;
        proxy_pass_request_body off;
        include /etc/nginx/snippets/brain-proxy-headers.conf;
        proxy_set_header Content-Length "";
    }
    location /internal/files/ {
        internal;
        alias /srv/brain/files/;
        include /etc/nginx/snippets/brain-security-headers.conf;
        # Attachments are documents, never part of the app: no scripts, no requests, no framing.
        add_header Content-Security-Policy "default-src 'none'; img-src 'self' data:; style-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    # Stored images: Django checks the owner at /api/inbox/<id>/thumbnail or /api/items/<id>/image and answers
    # with X-Accel-Redirect; the webp files were written by run_jobs or an upload (re-encoded, never the
    # original bytes; 0644, so this worker can read them).
    location /internal/thumbs/ {
        internal;
        alias /srv/brain/thumbs/;
        include /etc/nginx/snippets/brain-security-headers.conf;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    }

    # Everything else: Next.js (pages incl. the /inbox/them/ capture page, /manifest.webmanifest, /icons/,
    # /trees/, /original/, /vendor/, /_next/).
    location / { proxy_pass http://web; }
}
