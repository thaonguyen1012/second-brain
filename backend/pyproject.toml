[project]
name = "alex-brain-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2,<5.3",
  "djangorestframework>=3.16",
  "drf-spectacular>=0.28",
  "psycopg[binary]>=3.2",
  "django-environ>=0.12",
  "gunicorn>=23",
  "pyjwt[crypto]>=2.10",
  "django-stubs-ext>=6.1.2",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-django>=4.9",
  "ruff>=0.8",
  "mypy>=1.13",
  "django-stubs[compatible-mypy]>=5.1",
  "djangorestframework-stubs[compatible-mypy]>=3.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "SIM", "RUF"]
ignore = ["S101", "RUF012"]  # RUF012: Django Meta and DRF class attributes

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "-q"
