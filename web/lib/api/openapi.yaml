        * `dropped` - Dropped
    ItemWork:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
      required:
      - id
      - title
      - type
    JobAd:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        company:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        text:
          type: string
          readOnly: true
        month:
          type: string
          readOnly: true
        skills:
          type: array
          items:
            type: string
            maxLength: 60
          readOnly: true
        seniority:
          allOf:
          - $ref: '#/components/schemas/SeniorityEnum'
          readOnly: true
        processed:
          type: boolean
