        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
        title:
          type: string
          maxLength: 300
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 30
        source:
          type: string
          maxLength: 2000
        rating:
          type: integer
          maximum: 10
          minimum: 1
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - createdAt
      - id
      - title
      - type
      - updatedAt
    ItemLabel:
      type: object
      description: Just enough of an Item to label a link to it (badges on notes),
        so lists never need every Item.
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
      required:
      - id
      - title
      - type
    ItemRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
        title:
          type: string
          minLength: 1
          maxLength: 300
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 30
        source:
          type: string
          maxLength: 2000
        rating:
          type: integer
          maximum: 10
          minimum: 1
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - title
      - type
    ItemStatusEnum:
      enum:
      - planned
      - active
      - done
      - dropped
