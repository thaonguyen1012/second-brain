components:
  schemas:
    Achievement:
      type: object
      description: '`project` is the project Item id, `skills` the linked skills by
        name (prefetch both).'
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        impact:
          type: string
          readOnly: true
        project:
          type: integer
          readOnly: true
          nullable: true
        projectTitle:
          type: string
          nullable: true
          readOnly: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillRef'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - date
      - description
      - id
      - impact
      - project
      - projectTitle
      - skills
      - title
      - updatedAt
    AchievementWriteRequest:
      type: object
      description: |-
        Create (title required) or partial update. `project` is a project Item and `skills` (replaces the
        links) are skill ids, both of the owner in context["user"]; anything else answers 400.
      properties:
        date:
          type: string
          format: date
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        impact:
          type: string
          maxLength: 5000
        project:
          type: integer
          nullable: true
        skills:
          type: array
          items:
            type: integer
          maxItems: 30
      required:
      - title
    AttachInboxRequest:
      type: object
      description: Resolves linked ids against the owner in context["user"]; another
        user's row answers 400.
      properties:
        inboxEntry:
          type: integer
        stance:
          $ref: '#/components/schemas/EvidenceStanceEnum'
        title:
          type: string
          maxLength: 300
        note:
          type: string
          maxLength: 20000
        date:
          type: string
          format: date
        archive:
          type: boolean
          default: true
      required:
      - inboxEntry
      - stance
    AttachNewsRequest:
      type: object
      description: Resolves linked ids against the owner in context["user"]; another
        user's row answers 400.
      properties:
        newsItem:
          type: integer
        stance:
          $ref: '#/components/schemas/EvidenceStanceEnum'
        title:
          type: string
          maxLength: 300
        note:
          type: string
          maxLength: 20000
        date:
          type: string
          format: date
      required:
      - newsItem
      - stance
    AttachNewsResult:
      type: object
      properties:
        evidence:
          $ref: '#/components/schemas/Evidence'
        created:
          type: boolean
      required:
      - created
      - evidence
    AttachResult:
      type: object
      properties:
        evidence:
          $ref: '#/components/schemas/Evidence'
        created:
          type: boolean
        inboxStatus:
          $ref: '#/components/schemas/InboxStatusEnum'
      required:
      - created
      - evidence
      - inboxStatus
    BillingEnum:
      enum:
      - fixed
      - hourly
      type: string
      description: |-
        * `fixed` - Fixed
        * `hourly` - Hourly
    CarryCandidate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        weekStart:
          type: string
          format: date
        carried:
          type: boolean
      required:
      - carried
      - id
      - title
      - weekStart
    DailyBrief:
      type: object
      properties:
        date:
          type: string
          format: date
        intro:
          type: string
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/NewsItem'
      required:
      - date
      - generatedAt
      - intro
      - items
    DayWork:
      type: object
      properties:
        date:
          type: string
          format: date
        inboxArchived:
          type: array
          items:
            $ref: '#/components/schemas/InboxWork'
        itemsFinished:
          type: array
          items:
            $ref: '#/components/schemas/ItemWork'
        pagesDone:
          type: array
          items:
            $ref: '#/components/schemas/PageWork'
        minutesForObjectives:
          type: integer
        minutesOther:
          type: integer
      required:
      - date
      - inboxArchived
      - itemsFinished
      - minutesForObjectives
      - minutesOther
      - pagesDone
    Evidence:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          allOf:
          - $ref: '#/components/schemas/EvidenceKindEnum'
          readOnly: true
        stance:
          allOf:
          - $ref: '#/components/schemas/EvidenceStanceEnum'
          readOnly: true
        title:
          type: string
          readOnly: true
        url:
          type: string
          format: uri
          readOnly: true
        note:
          type: string
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        inboxEntry:
          type: integer
          readOnly: true
          nullable: true
        item:
          type: integer
          readOnly: true
          nullable: true
        libraryNote:
          type: integer
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - date
      - id
      - inboxEntry
      - item
      - kind
      - libraryNote
      - note
      - stance
      - title
      - updatedAt
      - url
    EvidenceCreateRequest:
      type: object
      description: Resolves linked ids against the owner in context["user"]; another
        user's row answers 400.
      properties:
        kind:
          $ref: '#/components/schemas/EvidenceKindEnum'
        stance:
          $ref: '#/components/schemas/EvidenceStanceEnum'
        title:
          type: string
          maxLength: 300
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        note:
          type: string
          maxLength: 20000
        date:
          type: string
          format: date
        inboxEntry:
          type: integer
          nullable: true
        item:
          type: integer
          nullable: true
        libraryNote:
          type: integer
          nullable: true
      required:
      - kind
      - stance
    EvidenceKindEnum:
      enum:
      - inbox
      - item
      - note
      - conversation
      - link
      type: string
      description: |-
        * `inbox` - Inbox
        * `item` - Item
        * `note` - Note
        * `conversation` - Conversation
        * `link` - Link
    EvidenceStanceEnum:
      enum:
      - supports
      - contradicts
      type: string
      description: |-
        * `supports` - Supports
        * `contradicts` - Contradicts
    FitSkill:
      type: object
      description: A skill an opportunity fits, with its freshness (annotated by `services.with_freshness()`).
      properties:
        id:
          type: integer
        name:
          type: string
        freshness:
          $ref: '#/components/schemas/SkillFreshnessEnum'
      required:
      - freshness
      - id
      - name
    InboxEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        text:
          type: string
          maxLength: 20000
        status:
          allOf:
          - $ref: '#/components/schemas/InboxStatusEnum'
          readOnly: true
        item:
          type: integer
          readOnly: true
          nullable: true
        itemTitle:
          type: string
          readOnly: true
          nullable: true
        itemType:
          type: string
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        archivedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        processed:
          type: boolean
          readOnly: true
        processedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error:
          type: string
          readOnly: true
        ogTitle:
          type: string
          readOnly: true
        ogDescription:
          type: string
          readOnly: true
        ogSiteName:
          type: string
          readOnly: true
        thumbnailUrl:
          type: string
          nullable: true
          readOnly: true
        suggestedTags:
          type: array
          items:
            type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        suggestedDestination:
          type: string
          readOnly: true
      required:
      - archivedAt
      - createdAt
      - error
      - id
      - item
      - itemTitle
      - itemType
      - ogDescription
      - ogSiteName
      - ogTitle
      - processed
      - processedAt
      - status
      - suggestedDestination
      - suggestedTags
      - summary
      - thumbnailUrl
    InboxEntryRequest:
      type: object
      properties:
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        text:
          type: string
          maxLength: 20000
    InboxStatusEnum:
      enum:
      - inbox
      - later
      - archived
      type: string
      description: |-
        * `inbox` - Inbox
        * `later` - Later
        * `archived` - Archived
    InboxWork:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
      required:
      - id
      - title
    Item:
      type: object
