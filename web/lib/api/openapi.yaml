        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Week'
          description: ''
  /api/weeks/current:
    get:
      operationId: getCurrentWeek
      description: This week (Europe/Prague); an empty one with `id` null until it
        is first written to.
      tags:
      - weeks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Week'
          description: ''
components:
  schemas:
    Achievement:
      type: object
      description: '`project` is the project Item id, `skills` the linked skills by
        name (prefetch both).'
      properties:
        id:
          type: integer
          readOnly: true
        date:
          type: string
          format: date
          readOnly: true
        title:
          type: string
          readOnly: true
        description:
          type: string
          readOnly: true
        impact:
          type: string
          readOnly: true
        project:
          type: integer
          readOnly: true
          nullable: true
        projectTitle:
          type: string
          nullable: true
          readOnly: true
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillRef'
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - createdAt
      - date
      - description
      - id
      - impact
      - project
      - projectTitle
      - skills
      - title
      - updatedAt
    AchievementWriteRequest:
      type: object
      description: |-
        Create (title required) or partial update. `project` is a project Item and `skills` (replaces the
        links) are skill ids, both of the owner in context["user"]; anything else answers 400.
      properties:
        date:
          type: string
          format: date
        title:
          type: string
          minLength: 1
          maxLength: 300
        description:
          type: string
          maxLength: 20000
        impact:
          type: string
          maxLength: 5000
        project:
          type: integer
          nullable: true
        skills:
          type: array
          items:
            type: integer
          maxItems: 30
      required:
      - title
    AttachInboxRequest:
      type: object
      description: Resolves linked ids against the owner in context["user"]; another
        user's row answers 400.
      properties:
        inboxEntry:
          type: integer
        stance:
          $ref: '#/components/schemas/EvidenceStanceEnum'
        title:
          type: string
          maxLength: 300
        note:
          type: string
          maxLength: 20000
        date:
          type: string
          format: date
        archive:
          type: boolean
          default: true
      required:
      - inboxEntry
      - stance
    AttachNewsRequest:
      type: object
      description: Resolves linked ids against the owner in context["user"]; another
        user's row answers 400.
      properties:
        newsItem:
          type: integer
        stance:
          $ref: '#/components/schemas/EvidenceStanceEnum'
        title:
          type: string
          maxLength: 300
        note:
          type: string
          maxLength: 20000
        date:
          type: string
          format: date
      required:
      - newsItem
      - stance
    AttachNewsResult:
      type: object
      properties:
        evidence:
          $ref: '#/components/schemas/Evidence'
        created:
          type: boolean
      required:
      - created
      - evidence
    AttachResult:
      type: object
      properties:
        evidence:
          $ref: '#/components/schemas/Evidence'
        created:
          type: boolean
        inboxStatus:
          $ref: '#/components/schemas/InboxStatusEnum'
      required:
      - created
      - evidence
      - inboxStatus
    BillingEnum:
      enum:
      - fixed
      - hourly
      type: string
      description: |-
        * `fixed` - Fixed
        * `hourly` - Hourly
    CarryCandidate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        weekStart:
          type: string
          format: date
        carried:
          type: boolean
      required:
      - carried
      - id
      - title
      - weekStart
    Counts:
      type: object
      description: |-
        The sidebar's numbers: each is the row count of the list its row opens, with the page's default
        filters. This week and this month are Europe/Prague.
      properties:
        objectivesOpen:
          type: integer
          description: Open objectives of this week; 0 while the week has no row yet.
        skills:
          type: integer
        tools:
          type: integer
          description: Items of type tool (GET /api/items?type=tool).
        jobAds:
          type: integer
          description: Job ads of this month (GET /api/market/job-ads?month=).
        achievements:
          type: integer
          description: Achievements of this week (GET /api/achievements?week=).
        items:
          type: integer
        notes:
          type: integer
        opportunities:
          type: integer
        projects:
          type: integer
        timerRunning:
          type: boolean
      required:
