openapi: 3.0.3
info:
  title: Alex's Brain API
  version: 0.1.0
paths:
  /api/inbox:
    get:
      operationId: listInbox
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - inbox
          - later
      tags:
      - inbox
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInboxEntryList'
          description: ''
    post:
      operationId: createInboxEntry
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxEntryRequest'
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
          description: ''
  /api/inbox/{id}:
    patch:
      operationId: updateInboxEntry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInboxTriageRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
          description: ''
  /api/items:
    get:
      operationId: listItems
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - done
          - dropped
          - planned
      - in: query
        name: type
        schema:
          type: string
          enum:
          - article
          - book
          - course
          - film
          - project
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
    post:
      operationId: createItem
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/items/{id}:
    patch:
      operationId: updateItem
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/me:
    get:
      operationId: getMe
      tags:
      - me
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/progress:
    get:
      operationId: getProgress
      tags:
      - progress
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
          description: ''
  /api/progress/{book}/{page}:
    put:
      operationId: setPageDone
      parameters:
      - in: path
        name: book
        schema:
          type: string
        required: true
      - in: path
        name: page
        schema:
          type: string
        description: Page path, '/' as %2F; '_index'.
        required: true
      tags:
      - progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDoneRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDoneResponse'
          description: ''
  /api/progress/last-visited:
    put:
      operationId: setLastVisited
      tags:
      - progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLastVisitedRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastVisited'
          description: ''
  /api/projects:
    get:
      operationId: listProjects
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - done
          - dropped
          - planned
      tags:
      - projects
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: createProject
      description: An Item with type=project plus its client and price, in one write.
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}:
    get:
      operationId: getProject
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: updateProject
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/time-entries:
    get:
      operationId: listTimeEntries
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date
        description: First day, inclusive.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: project
        schema:
          type: integer
        description: Project (Item) id.
      - in: query
        name: to
        schema:
          type: string
          format: date
        description: Last day, inclusive.
      tags:
      - time-entries
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTimeEntryList'
          description: ''
    post:
      operationId: createTimeEntry
      description: Time typed in by hand.
      tags:
      - time-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeEntryCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
          description: ''
  /api/time-entries/{id}:
    patch:
      operationId: updateTimeEntry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - time-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedTimeEntryUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
          description: ''
  /api/time-entries/summary:
    get:
      operationId: getTimeSummary
      description: Billable and non-billable minutes of one week, in total and per
        project.
      parameters:
      - in: query
        name: week
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD; default this week.
      tags:
      - time-entries
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekSummary'
          description: ''
  /api/time-entries/timer:
    get:
      operationId: getTimer
      description: The running timer entry, or null.
      tags:
      - time-entries
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Timer'
          description: ''
  /api/time-entries/timer/start:
    post:
      operationId: startTimer
      description: Start a timer; a timer already running is stopped first.
      tags:
      - time-entries
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimerStartRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
          description: ''
  /api/time-entries/timer/stop:
    post:
      operationId: stopTimer
      description: Stop the running timer; 404 when nothing runs.
      tags:
      - time-entries
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeEntry'
          description: ''
  /api/weeks:
    get:
      operationId: listWeeks
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - weeks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWeekList'
          description: ''
  /api/weeks/{start}/objectives:
    post:
      operationId: createObjective
      parameters:
      - in: path
        name: start
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD.
        required: true
      tags:
      - weeks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ObjectiveCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
          description: ''
  /api/weeks/{start}/objectives/{id}:
    patch:
      operationId: updateObjective
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      - in: path
        name: start
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD.
        required: true
      tags:
      - weeks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedObjectiveUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Objective'
          description: ''
  /api/weeks/{start}/plan:
    get:
      operationId: getWeekPlan
      description: The week (created on first access) and the previous week's open
        objectives.
      parameters:
      - in: path
        name: start
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD.
        required: true
      tags:
      - weeks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanView'
          description: ''
    post:
      operationId: planWeek
      parameters:
      - in: path
        name: start
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD.
        required: true
      tags:
      - weeks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Week'
          description: ''
  /api/weeks/{start}/review:
    get:
      operationId: getWeekReview
      description: Objective progress and body of work per day; 404 for a week that
        was never opened.
      parameters:
      - in: path
        name: start
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD.
        required: true
      tags:
      - weeks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewView'
          description: ''
    patch:
      operationId: updateWeekReview
      parameters:
      - in: path
        name: start
        schema:
          type: string
          format: date
        description: The week's Monday, YYYY-MM-DD.
        required: true
      tags:
      - weeks
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedReviewUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Week'
          description: ''
  /api/weeks/current:
    get:
      operationId: getCurrentWeek
      description: This week (Europe/Prague), created empty on first access.
      tags:
      - weeks
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Week'
          description: ''
components:
  schemas:
    BillingEnum:
      enum:
      - fixed
      - hourly
      type: string
      description: |-
        * `fixed` - Fixed
        * `hourly` - Hourly
    CarryCandidate:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        weekStart:
          type: string
          format: date
        carried:
          type: boolean
      required:
      - carried
      - id
      - title
      - weekStart
    DayWork:
      type: object
      properties:
        date:
          type: string
          format: date
        inboxArchived:
          type: array
          items:
            $ref: '#/components/schemas/InboxWork'
        itemsFinished:
          type: array
          items:
            $ref: '#/components/schemas/ItemWork'
        pagesDone:
          type: array
          items:
            $ref: '#/components/schemas/PageWork'
        minutesForObjectives:
          type: integer
        minutesOther:
          type: integer
      required:
      - date
      - inboxArchived
      - itemsFinished
      - minutesForObjectives
      - minutesOther
      - pagesDone
    InboxEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        text:
          type: string
          maxLength: 20000
        status:
          allOf:
          - $ref: '#/components/schemas/InboxStatusEnum'
          readOnly: true
        item:
          type: integer
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        processed:
          type: boolean
          readOnly: true
        processedAt:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        error:
          type: string
          readOnly: true
        ogTitle:
          type: string
          readOnly: true
        ogDescription:
          type: string
          readOnly: true
        ogSiteName:
          type: string
          readOnly: true
        thumbnailUrl:
          type: string
          nullable: true
          readOnly: true
        suggestedTags:
          type: array
          items:
            type: string
          readOnly: true
        summary:
          type: string
          readOnly: true
        suggestedDestination:
          type: string
          readOnly: true
      required:
      - createdAt
      - error
      - id
      - item
      - ogDescription
      - ogSiteName
      - ogTitle
      - processed
      - processedAt
      - status
      - suggestedDestination
      - suggestedTags
      - summary
      - thumbnailUrl
    InboxEntryRequest:
      type: object
      properties:
        url:
          oneOf:
          - type: string
            format: uri
            maxLength: 2000
          - type: string
            maxLength: 0
        text:
          type: string
          maxLength: 20000
    InboxStatusEnum:
      enum:
      - inbox
      - later
      - archived
      type: string
      description: |-
        * `inbox` - Inbox
        * `later` - Later
        * `archived` - Archived
    InboxWork:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
      required:
      - id
      - title
    Item:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
        title:
          type: string
          maxLength: 300
        tags:
          type: array
          items:
            type: string
            maxLength: 50
          maxItems: 30
        source:
          type: string
          maxLength: 2000
        rating:
          type: integer
          maximum: 10
          minimum: 1
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - createdAt
      - id
      - title
      - type
      - updatedAt
    ItemRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/TypeEnum'
        status:
          $ref: '#/components/schemas/ItemStatusEnum'
        title:
          type: string
          minLength: 1
          maxLength: 300
        tags:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 50
          maxItems: 30
        source:
          type: string
          maxLength: 2000
        rating:
          type: integer
          maximum: 10
          minimum: 1
          nullable: true
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
      required:
      - title
      - type
    ItemStatusEnum:
      enum:
      - planned
      - active
      - done
      - dropped
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `done` - Done
        * `dropped` - Dropped
    ItemWork:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        type:
          type: string
      required:
      - id
      - title
      - type
    LastVisited:
      type: object
      properties:
        bookSlug:
          type: string
        pageSlug:
          type: string
        title:
          type: string
        at:
          type: string
          format: date-time
      required:
      - at
      - bookSlug
      - pageSlug
    Me:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        name:
          type: string
      required:
      - email
      - id
      - name
    Objective:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 300
        status:
          $ref: '#/components/schemas/ObjectiveStatusEnum'
        position:
          type: integer
          readOnly: true
        carriedFrom:
          type: integer
          readOnly: true
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
      required:
      - carriedFrom
      - createdAt
      - id
      - position
      - title
      - updatedAt
    ObjectiveCounts:
      type: object
      properties:
        open:
          type: integer
        done:
          type: integer
        dropped:
          type: integer
      required:
      - done
      - dropped
      - open
    ObjectiveCreateRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
      required:
      - title
    ObjectiveStatusEnum:
      enum:
      - open
      - done
      - dropped
      type: string
      description: |-
        * `open` - Open
        * `done` - Done
        * `dropped` - Dropped
    ObjectiveTime:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        minutes:
          type: integer
      required:
      - id
      - minutes
      - title
    PageWork:
      type: object
      properties:
        book:
          type: string
        page:
          type: string
      required:
      - book
      - page
    PaginatedInboxEntryList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/InboxEntry'
    PaginatedItemList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    PaginatedProjectList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    PaginatedTimeEntryList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
