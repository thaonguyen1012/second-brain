openapi: 3.0.3
info:
  title: Alex's Brain API
  version: 0.1.0
paths:
  /api/achievements:
    get:
      operationId: listAchievements
      description: The brag document, newest date first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: week
        schema:
          type: string
          format: date
        description: 'Only that week: its Monday, YYYY-MM-DD.'
      tags:
      - achievements
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAchievementList'
          description: ''
    post:
      operationId: createAchievement
      description: The brag document, newest date first.
      tags:
      - achievements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Achievement'
          description: ''
  /api/achievements/{id}:
    patch:
      operationId: updateAchievement
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - achievements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAchievementWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Achievement'
          description: ''
  /api/brief/{day}:
    get:
      operationId: getBrief
      description: The brief of a day (YYYY-MM-DD); 404 when there is none.
      parameters:
      - in: path
        name: day
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: true
      tags:
      - brief
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBrief'
          description: ''
  /api/brief/today:
    get:
      operationId: getTodayBrief
      description: Today's brief (Europe/Prague); 404 until the morning job has built
        it.
      tags:
      - brief
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBrief'
          description: ''
  /api/inbox:
    get:
      operationId: listInbox
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - inbox
          - later
      tags:
      - inbox
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInboxEntryList'
          description: ''
    post:
      operationId: createInboxEntry
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxEntryRequest'
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
          description: ''
  /api/inbox/{id}:
    patch:
      operationId: updateInboxEntry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInboxTriageRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
          description: ''
  /api/items:
    get:
      operationId: listItems
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - done
          - dropped
          - planned
      - in: query
        name: type
        schema:
          type: string
          enum:
          - article
          - book
          - course
          - film
          - project
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
    post:
      operationId: createItem
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/items/{id}:
    patch:
      operationId: updateItem
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/market/job-ads:
    get:
      operationId: listJobAds
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: month
        schema:
          type: string
        description: 'YYYY-MM; default: this month (Europe/Prague).'
      tags:
      - market
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobAdList'
          description: ''
    post:
      operationId: createJobAd
      description: Stores the ad and returns at once; a background job extracts the
        skills it asks for.
      tags:
      - market
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobAdWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAd'
          description: ''
  /api/market/job-ads/{id}:
    patch:
      operationId: updateJobAd
      description: Changed title, company or text re-runs the extraction; `skills`
        corrects it by hand.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - market
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobAdWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAd'
          description: ''
  /api/market/report:
    get:
      operationId: getMarketReport
      description: Skill frequency in the month's job ads vs the previous month, next
        to the skills matrix.
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: 'YYYY-MM; default: this month (Europe/Prague).'
      tags:
      - market
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketReport'
          description: ''
  /api/me:
    get:
      operationId: getMe
      tags:
      - me
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/news:
    get:
      operationId: listNews
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
        description: 'YYYY-MM-DD: fetched that day (Europe/Prague).'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: minRelevance
        schema:
          type: integer
        description: 1-5.
      - in: query
        name: newTool
        schema:
          type: boolean
        description: 'true: only "new tool/skill" items.'
      - in: query
        name: source
        schema:
          type: integer
      - in: query
        name: tag
        schema:
          type: string
        description: Only items with this topic tag.
      - in: query
        name: tagStatus
        schema:
          type: string
          enum:
          - failed
          - queued
          - skipped
          - tagged
      tags:
      - news
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNewsItemList'
          description: ''
  /api/news/topics:
    get:
      operationId: getNewsTopicCounts
      description: How often each topic tag appeared in the fetched news per ISO week,
        oldest week first.
      parameters:
      - in: query
        name: weeks
        schema:
          type: integer
        description: 1-52, default 8.
      tags:
      - news
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicCounts'
          description: ''
  /api/notes:
    get:
      operationId: listNotes
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: item
        schema:
          type: integer
        description: Only notes linked to this Item id.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in title or markdown.
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoteList'
          description: ''
    post:
      operationId: createNote
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/notes/{id}:
    get:
      operationId: getNote
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    patch:
      operationId: updateNote
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/opportunities:
    get:
      operationId: listOpportunities
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: decision
        schema:
          type: string
          enum:
          - build
          - drop
          - keep
          - open
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: stale
        schema:
          type: boolean
        description: 'true: only stale ones; false: only fresh ones.'
      tags:
      - opportunities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOpportunityList'
          description: ''
    post:
      operationId: createOpportunity
      description: The opportunity and, with `scores`, its first score snapshot.
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpportunityCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetail'
          description: ''
  /api/opportunities/{id}:
    get:
      operationId: getOpportunity
      description: With its evidence and score history.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetail'
          description: ''
    patch:
      operationId: updateOpportunity
      description: Text fields, deadline and decision; scores change only through
        POST .../scores.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedOpportunityWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpportunityDetail'
          description: ''
  /api/opportunities/{id}/evidence:
    post:
      operationId: addOpportunityEvidence
      description: Evidence linked to an inbox entry, Item or Note, or a conversation
        / link record.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvidenceCreateRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
          description: ''
  /api/opportunities/{id}/evidence/{evidence_id}:
    patch:
      operationId: updateOpportunityEvidence
      parameters:
      - in: path
        name: evidence_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEvidenceUpdateRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
          description: ''
  /api/opportunities/{id}/evidence/inbox:
    post:
      operationId: attachInboxEntryAsEvidence
      description: |-
        Weekly triage in one action: the inbox entry becomes evidence and (by default) is archived.

        201 when the evidence is new, 200 when the entry was already attached to this opportunity.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachInboxRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachResult'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachResult'
          description: ''
  /api/opportunities/{id}/evidence/news:
    post:
      operationId: attachNewsItemAsEvidence
      description: |-
        The morning-brief button: this news item is evidence for this opportunity (kind link).

        201 when the evidence is new, 200 when the item's URL is already link evidence of this opportunity.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttachNewsRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachNewsResult'
          description: ''
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachNewsResult'
          description: ''
  /api/opportunities/{id}/scores:
    post:
      operationId: recordOpportunityScores
      description: A new snapshot of the four scores; older snapshots are kept as
        history.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - opportunities
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoresWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSnapshot'
          description: ''
  /api/predictions:
    get:
      operationId: listPredictions
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: due
        schema:
          type: boolean
        description: 'true: open ones whose checkOn has come (Europe/Prague); false:
          the others.'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: outcome
        schema:
          type: string
          enum:
          - open
          - partial
          - right
          - wrong
      tags:
      - predictions
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPredictionList'
          description: ''
    post:
      operationId: createPrediction
      tags:
      - predictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
          description: ''
  /api/predictions/{id}:
    patch:
      operationId: updatePrediction
      description: Re-score with `outcome` (right, wrong, partial; open again clears
        `scoredAt`) and `note`.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - predictions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPredictionWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
          description: ''
  /api/progress:
    get:
      operationId: getProgress
      tags:
      - progress
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressSnapshot'
          description: ''
  /api/progress/{book}/{page}:
    put:
      operationId: setPageDone
      parameters:
      - in: path
        name: book
        schema:
          type: string
        required: true
      - in: path
        name: page
        schema:
          type: string
        description: Page path, '/' as %2F; '_index'.
        required: true
      tags:
      - progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDoneRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetDoneResponse'
          description: ''
  /api/progress/last-visited:
    put:
      operationId: setLastVisited
      tags:
      - progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetLastVisitedRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LastVisited'
          description: ''
  /api/projects:
    get:
      operationId: listProjects
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - done
          - dropped
          - planned
      tags:
      - projects
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProjectList'
          description: ''
    post:
      operationId: createProject
      description: An Item with type=project plus its client and price, in one write.
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/projects/{id}:
    get:
      operationId: getProject
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
    patch:
      operationId: updateProject
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - projects
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProjectWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
          description: ''
  /api/skills:
    get:
      operationId: listSkills
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: freshness
        schema:
          type: string
          enum:
          - aging
          - faded
          - fresh
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - skills
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
