openapi: 3.0.3
info:
  title: Alex's Brain API
  version: 0.1.0
paths:
  /api/achievements:
    get:
      operationId: listAchievements
      description: The brag document, newest date first.
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in the title, impact or description.
      - in: query
        name: week
        schema:
          type: string
          format: date
        description: 'Only that week: its Monday, YYYY-MM-DD.'
      tags:
      - achievements
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAchievementList'
          description: ''
    post:
      operationId: createAchievement
      description: The brag document, newest date first.
      tags:
      - achievements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AchievementWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Achievement'
          description: ''
  /api/achievements/{id}:
    get:
      operationId: getAchievement
      description: One brag-document line (Cmd+K deep link /phat-trien/thanh-tuu/?achievement=N).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - achievements
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Achievement'
          description: ''
    patch:
      operationId: updateAchievement
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - achievements
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAchievementWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Achievement'
          description: ''
    delete:
      operationId: deleteAchievement
      description: The linked project Item and skills stay.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - achievements
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/brief/{day}:
    get:
      operationId: getBrief
      description: The brief of a day (YYYY-MM-DD); 404 when there is none.
      parameters:
      - in: path
        name: day
        schema:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2}$
        required: true
      tags:
      - brief
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBrief'
          description: ''
  /api/brief/today:
    get:
      operationId: getTodayBrief
      description: Today's brief (Europe/Prague); 404 until the morning job has built
        it.
      tags:
      - brief
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBrief'
          description: ''
  /api/counts:
    get:
      operationId: getCounts
      description: 'The sidebar''s numbers: each list''s row count with its page''s
        default filters; a running timer.'
      tags:
      - counts
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Counts'
          description: ''
  /api/export:
    get:
      operationId: downloadExport
      description: |-
        A copy of all the owner's data (DECISIONS 4.7) as a zip, the same files as `manage.py export`:
        notes/*.md, data/*.json, images/*.webp (Item images), manifest.json. No secrets: no password hash,
        sessions, jobs or LLM rows.
      tags:
      - export
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/zip:
              schema:
                type: string
                format: binary
          description: alex-brain-<date>.zip, streamed.
  /api/inbox:
    get:
      operationId: listInbox
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in the OG title, text or URL.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - inbox
          - later
      tags:
      - inbox
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedInboxEntryList'
          description: ''
    post:
      operationId: createInboxEntry
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InboxEntryRequest'
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
          description: ''
  /api/inbox/{id}:
    patch:
      operationId: updateInboxEntry
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedInboxTriageRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxEntry'
          description: ''
    delete:
      operationId: deleteInboxEntry
      description: Evidence made from it keeps its title snapshot.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inbox
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/inbox/count:
    get:
      operationId: countInbox
      description: How many entries have the status (the Inbox badge in the top bar
        and on Hôm nay), one COUNT.
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - inbox
          - later
        description: Default inbox.
      tags:
      - inbox
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InboxCount'
          description: ''
  /api/items:
    get:
      operationId: listItems
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in title, summary or source, or one exact
          tag.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - done
          - dropped
          - planned
      - in: query
        name: type
        schema:
          type: string
          enum:
          - article
          - book
          - course
          - film
          - project
          - tool
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedItemList'
          description: ''
    post:
      operationId: createItem
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/items/{id}:
    get:
      operationId: getItem
      description: One Item with its noteCount (Cmd+K deep link /thu-vien/?item=N).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
    patch:
      operationId: updateItem
      description: |-
        A status change moves startedAt / finishedAt unless the body sets them (apply_status_dates); a new
        http(s) source of an Item without an image queues its image.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedItemRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
    delete:
      operationId: deleteItem
      description: |-
        Links to it are cleared (notes, inbox, evidence, achievements); 409 for a project with time
        entries.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: ''
  /api/items/{id}/image:
    post:
      operationId: uploadItemImage
      description: |-
        Set (or replace) the image from a file: JPEG, PNG, GIF or WebP up to 10 MB, stored re-encoded as a
        webp of at most 600 px. Answers the Item; the replaced file goes unless another row uses it, and a
        fetch from a link that waits or runs is ended (the upload wins).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ItemImageUploadRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
    delete:
      operationId: deleteItemImage
      description: |-
        Remove the image (also when there is none) and end a fetch from a link that waits or runs, so it
        never puts an image back; the file goes unless another row uses it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/items/{id}/image/fetch:
    post:
      operationId: fetchItemImage
      description: |-
        Take the image from a link, in the background: the og:image of the page, or the URL itself when it
        is an image (`url`, default the Item's source). Answers 202 with the Item (imagePending true) at once;
        run_jobs makes the request, so the image appears within about 5 minutes. It replaces only the image
        the Item had when asked: an upload, a removal or an inbox link made meanwhile ends the fetch.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ItemImageFetchRequest'
      security:
      - sessionAuth: []
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Item'
          description: ''
  /api/items/{id}/mentions:
    get:
      operationId: getItemMentions
      description: |-
        Where the Item is used ("Được nhắc tới ở" on the Item page): the opportunities that hold it as
        evidence, with the stance of each row, and the skills that do, with their freshness. 404 for another
        owner's Item.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - items
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemMentions'
          description: ''
  /api/market/job-ads:
    get:
      operationId: listJobAds
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: month
        schema:
          type: string
        description: 'YYYY-MM; omitted: every month.'
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in the title or company.
      tags:
      - market
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedJobAdList'
          description: ''
    post:
      operationId: createJobAd
      description: Stores the ad and returns at once; a background job extracts the
        skills it asks for.
      tags:
      - market
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobAdWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAd'
          description: ''
  /api/market/job-ads/{id}:
    get:
      operationId: getJobAd
      description: One ad (Cmd+K deep link /phat-trien/thi-truong/?jobAd=N).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - market
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAd'
          description: ''
    patch:
      operationId: updateJobAd
      description: Changed title, company or text re-runs the extraction; `skills`
        corrects it by hand.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - market
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedJobAdWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAd'
          description: ''
    delete:
      operationId: deleteJobAd
      description: The market report counts without it; a pending extraction job finds
        nothing and stops.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - market
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/market/report:
    get:
      operationId: getMarketReport
      description: Skill frequency in the month's job ads vs the previous month, next
        to the skills matrix.
      parameters:
      - in: query
        name: month
        schema:
          type: string
        description: 'YYYY-MM; default: this month (Europe/Prague).'
      tags:
      - market
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarketReport'
          description: ''
  /api/me:
    get:
      operationId: getMe
      tags:
      - me
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
          description: ''
  /api/news:
    get:
      operationId: listNews
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: date
        schema:
          type: string
        description: 'YYYY-MM-DD: fetched that day (Europe/Prague).'
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: minRelevance
        schema:
          type: integer
        description: 1-5.
      - in: query
        name: newTool
        schema:
          type: boolean
        description: 'true: only "new tool/skill" items.'
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in the title.
      - in: query
        name: source
        schema:
          type: integer
      - in: query
        name: tag
        schema:
          type: string
        description: Only items with this topic tag.
      - in: query
        name: tagStatus
        schema:
          type: string
          enum:
          - failed
          - queued
          - skipped
          - tagged
      tags:
      - news
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNewsItemList'
          description: ''
  /api/news/{id}:
    patch:
      operationId: rateNewsItem
      description: |-
        The "useful / not useful" button: `feedback` is useful, not_useful or null (clears the rating). A
        body without `feedback` changes nothing (PATCH semantics, as the schema documents it).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - news
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNewsFeedbackRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItem'
          description: ''
  /api/news/topics:
    get:
      operationId: getNewsTopicCounts
      description: How often each topic tag appeared in the fetched news per ISO week,
        oldest week first.
      parameters:
      - in: query
        name: weeks
        schema:
          type: integer
        description: 1-52, default 8.
      tags:
      - news
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TopicCounts'
          description: ''
  /api/notes:
    get:
      operationId: listNotes
      parameters:
      - in: query
        name: clientId
        schema:
          type: string
          format: uuid
        description: Only the note a create with this `clientId` made (none if it
          never arrived).
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: item
        schema:
          type: integer
        description: Only notes linked to this Item id.
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in title or markdown.
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedNoteList'
          description: ''
    post:
      operationId: createNote
      description: |-
        201 with the new note; 200 with the note an earlier POST with the same `clientId` made (nothing
        changes then).
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NoteWriteRequest'
        required: true
      security:
      - sessionAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
  /api/notes/{id}:
    get:
      operationId: getNote
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
    patch:
      operationId: updateNote
      description: |-
        With `baseUpdatedAt` (the version the edit started from): 409 and the note as it is now when it was
        saved since then, and nothing is written.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNoteWriteRequest'
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteConflict'
          description: ''
    delete:
      operationId: deleteNote
      description: Evidence that pointed at the note keeps its title snapshot.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '204':
          description: No response body
  /api/notes/{id}/mentions:
    get:
      operationId: getNoteMentions
      description: |-
        The notes whose text links this note ("Được nhắc tới ở" on the note page). 404 for another owner's
        note.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteMentions'
          description: ''
  /api/notes/search:
    get:
      operationId: searchNotes
      description: 'Cmd+K: the newest matching notes with an excerpt around the match,
        never the whole markdown.'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
        description: 1-20, default 5.
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in title or markdown.
        required: true
      tags:
      - notes
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteSearch'
          description: ''
  /api/opportunities:
    get:
      operationId: listOpportunities
      parameters:
      - name: cursor
        required: false
        in: query
        description: The pagination cursor value.
        schema:
          type: string
      - in: query
        name: decision
        schema:
          type: string
          enum:
          - build
          - drop
          - keep
          - open
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
        description: Case-insensitive match in title or hypothesis.
      - in: query
        name: stale
        schema:
          type: boolean
        description: 'true: only stale ones; false: only fresh ones.'
      tags:
      - opportunities
      security:
      - sessionAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedOpportunityList'
          description: ''
    post:
      operationId: createOpportunity
      description: The opportunity and, with `scores`, its first score snapshot.
